[package]
name = "wills-locadora-player"
version = "0.1.0"
description = "Native shell for Will's Locadora Player"
authors = ["Illan Rego"]
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "wills_locadora_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
base64 = "0.22.1"
locadora-native-core = { path = "../crates/native-core" }
keyring = "4.2.0"
leveldb-core = "0.1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.1", features = [] }
urlencoding = "2.1"
url = "2.5"
gtk = "0.18.2"

[patch.crates-io]
tauri-runtime-wry = { path = "vendor/tauri-runtime-wry-2.11.4" }
