[package]
name = "wills-locadora-player"
version = "0.1.0"
description = "Native shell for Will's Locadora Player"
authors = ["Illan Rego"]
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "wills_locadora_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
locadora-native-core = { path = "../crates/native-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.1", features = [] }
urlencoding = "2.1"
