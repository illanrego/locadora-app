[package]
name = "locadora-native-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
chrono = "0.4"
futures = "0.3"
futures-util = "0.3.31"
http = "1.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
stremio-core = { git = "https://github.com/Stremio/stremio-core.git", rev = "b3062f7fa790223540022f9a62c12067b646c179", features = ["env-future-send"] }
thiserror = "2.0"
url = "2.5"
